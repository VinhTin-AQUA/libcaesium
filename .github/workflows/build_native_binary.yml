name: libcaesium native binary

on:
    push:
        branches: ['main']

    pull_request:
        branches: ['main']

env:
    TAG_NAME: libcaesium_native_bin_v1.0.0
    RELEASE_NAME: libcaesium_native_bin_v1.0.0

jobs:
    publish-binary:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: 'zulu'
                  java-version: '21'

            - name: Setup Android SDK
              uses: android-actions/setup-android@v3
              with:
                  api-level: 35
                  build-tools: '35.0.0'
                  ndk-version: '27.0.11902837'

            - name: Install NDK
              run: sdkmanager "ndk;27.0.11902837"

            - name: install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-gnu,x86_64-unknown-linux-gnu,aarch64-linux-android

            - name: Build app bundle
              run: |
                  chmod +x ./build.sh
                  ./build.sh

            - name: Create archive
              run: |
                  zip -r libcaesium.zip native-binaries

            - name: Remove old tag if exists
              run: |
                  if git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}"; then
                    echo "Deleting old tag..."
                    git push origin :refs/tags/"${TAG_NAME}"
                  else
                    echo "No old tag found."
                  fi

            - name: Create Tag
              run: |
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"
                  git tag "${TAG_NAME}"
                  git push origin "${TAG_NAME}"

            - name: Remove old release if exists
              run: |
                  if gh release view "${RELEASE_NAME}" &>/dev/null; then
                    echo "Deleting old release..."
                    gh release delete "${RELEASE_NAME}" -y
                  else
                    echo "No old release found."
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish
              uses: softprops/action-gh-release@v1
              with:
                  draft: false
                  name: ${{ env.RELEASE_NAME }}
                  tag_name: ${{ env.TAG_NAME }}
                  generate_release_notes: true
                  files: |
                      ./libcaesium.zip
